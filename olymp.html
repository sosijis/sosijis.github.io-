<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Олимпиада по биологии</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #d9d9d9;
    --card: #fbfcf8;
    --text: #22223a;
    --muted: #707a8a;
    --opt: #efedfb;
    --opt-hover: #e4e0f8;
    --opt-sel: #dcd6fb;
    --ring: #a9b3c1;
    --accent: #4d8ef0;
    --accent-dis: #bcd3fb;
    --nav: #6f86a8;
    --ok: #dff3e2;
    --ok-b: #3aa55a;
    --bad: #fbe2e2;
    --bad-b: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171c; --card: #1f2229; --text: #e8e9ee; --muted: #9aa3b2;
      --opt: #2a2840; --opt-hover: #343150; --opt-sel: #403b66; --ring: #6b7487;
      --accent: #5b9bf5; --accent-dis: #2f4466; --nav: #51617d;
      --ok: #1f3a27; --bad: #42242a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Golos Text", system-ui, sans-serif;
    min-height: 100vh; display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 560px; padding: 16px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .lang { background: var(--opt); border-radius: 10px; padding: 10px 16px; font-size: 15px; }
  .timer { color: var(--muted); font-size: 15px; }
  .card {
    background: var(--card); border-radius: 14px; padding: 28px 18px 24px;
    min-height: 70vh; display: flex; flex-direction: column;
  }
  h2 { font-size: 26px; margin: 0 0 28px; font-weight: 700; }
  .q { font-size: 18px; line-height: 1.9; margin-bottom: 18px; }
  .img { display: block; max-width: 100%; margin: 6px auto 22px; border-radius: 4px; }
  .pic { display: flex; justify-content: center; gap: 10px; font-size: 64px; margin: 6px 0 22px; flex-wrap: wrap; }
  .opt {
    display: flex; gap: 16px; align-items: center; background: var(--opt);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; cursor: pointer;
    font-size: 20px; line-height: 1.4; border: 2px solid transparent; transition: background .15s;
  }
  .opt:hover { background: var(--opt-hover); }
  .opt.sel { background: var(--opt-sel); }
  .opt.ok { background: var(--ok); border-color: var(--ok-b); }
  .opt.bad { background: var(--bad); border-color: var(--bad-b); }
  .mark {
    flex: none; width: 34px; height: 34px; border: 2px solid var(--ring); background: var(--card);
    display: grid; place-items: center;
  }
  .radio .mark { border-radius: 50%; }
  .check .mark { border-radius: 6px; }
  .opt.sel .mark { border-color: var(--accent); }
  .radio .opt.sel .mark::after { content: ""; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); }
  .check .opt.sel .mark { background: var(--accent); }
  .check .opt.sel .mark::after { content: "✓"; color: #fff; font-size: 20px; }
  .hint { text-align: center; color: var(--muted); font-size: 15px; margin: 24px 0 14px; }
  .btn {
    width: 100%; border: 0; border-radius: 12px; padding: 18px; font-size: 19px;
    font-family: inherit; color: #fff; background: var(--accent); cursor: pointer;
  }
  .btn:disabled { background: var(--accent-dis); cursor: default; }
  .explain { margin-top: 14px; font-size: 16px; line-height: 1.5; color: var(--muted); }
  .nav { display: flex; justify-content: space-between; margin-top: auto; padding-top: 22px; }
  .arrow {
    width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--nav);
    color: #fff; font-size: 30px; cursor: pointer; display: grid; place-items: center;
  }
  .arrow:disabled { opacity: .35; cursor: default; }
  .center { text-align: center; margin: auto 0; }
  .center h3 { font-size: 26px; margin: 0 0 18px; }
  .center p { font-size: 19px; line-height: 1.7; }
  .dots { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .dot { width: 30px; height: 30px; border-radius: 8px; background: var(--opt); font-size: 13px; display: grid; place-items: center; cursor: pointer; }
  .dot.done { background: var(--opt-sel); }
  .dot.cur { outline: 2px solid var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="lang">Рус ⌄</div><div class="timer" id="timer"></div></div>
  <div class="dots" id="dots"></div>
  <div class="card" id="card"></div>
</div>

    text2: "Арина сказала, что это череп хищника, потому что у него хорошо развиты клыки и крупные глазницы. Андрей предположил, что это череп грызуна, так как на верхней и нижней челюстях есть только резцы и коренные зубы. Ярослава решила, что это череп травоядного животного, потому что у него нет клыков, а резцы и коренные зубы разделены широким промежутком — диастемой. Наташа считает, что это череп птицы, так как он лёгкий, а глазницы очень крупные.<br>Кто из ребят прав?",
    opts: ["Наташа", "Арина", "Ярослава", "Андрей"] },
  { block: 1, n: 4, text: "В лесах средней полосы старые дупла часто занимают летучие мыши. Некоторые виды мелких комаров откладывают яйца в скоплениях помёта летучих мышей на дне дупла, и их личинки развиваются там, питаясь органическими остатками.<br>Как называется такой тип взаимоотношений между летучей мышью и комаром?",
    opts: ["Хищничество", "Мутуализм", "Паразитизм", "Комменсализм"] },

  { block: 2, n: 2, text: "Зубы млекопитающих — это специализированные органы во рту, которые располагаются в лунках челюстей. Они имеют разное строение и выполняют множество функций.<br>Выберите верные утверждения:",

    text2: "Выберите верные утверждения об этой птице:",
    opts: ["Тазовые кости срослись в сложный крестец, что обеспечивает жёсткость скелета при полёте",
           "Киль грудной кости отсутствует, поэтому он не способен к длительному полёту",
           "Всеядная птица, которая питается как растительной, так и животной пищей",
           "Имеет двойное дыхание благодаря системе воздушных мешков, что обеспечивает высокую интенсивность газообмена",
           "Имеет высокий уровень обмена веществ, что связано с поддержанием постоянной высокой температуры тела"] },
];

const TOTAL_MIN = 80;
const state = { i: -1, sel: QUESTIONS.map(() => []), saved: QUESTIONS.map(() => null), shownBlock: 0 };
const end = Date.now() + TOTAL_MIN * 60000;
const card = document.getElementById("card");

function tick() {
  const left = Math.max(0, Math.ceil((end - Date.now()) / 60000));
  document.getElementById("timer").textContent = `Осталось ${left} минут`;
}
setInterval(tick, 5000); tick();

function dots() {
  const d = document.getElementById("dots");
  d.innerHTML = "";
  QUESTIONS.forEach((q, k) => {
    const el = document.createElement("div");
    el.className = "dot" + (state.saved[k] ? " done" : "") + (k === state.i ? " cur" : "");
    el.textContent = q.n;
    el.onclick = () => { state.i = k; render(); };
    d.appendChild(el);
  });
}

function intro(block) {
  const multi = block === 2;
  card.innerHTML = `
    <div class="center">
      <h3>Блок ${block}</h3>
      <p>В заданиях этого блока нужно выбрать <b>${multi ? "все" : "один"}</b>
      верны${multi ? "е ответы" : "й ответ"} из списка.</p>
    </div>
    <button class="btn" id="go">Вперёд</button>`;
  document.getElementById("go").onclick = () => { state.i++; state.shownBlock = block; render(); };
}

function results() {
  const done = state.saved.filter(Boolean).length;
  card.innerHTML = `
    <div class="center">
      <h3>Задания закончились</h3>
      <p>Сохранено ответов: <b>${done}</b> из ${QUESTIONS.length}</p>
    </div>`;
  dots();
}

function render() {
  if (state.i < 0) { intro(1); dots(); return; }
  if (state.i >= QUESTIONS.length) { results(); return; }
  const q = QUESTIONS[state.i];
  if (q.block > state.shownBlock) { state.i--; intro(q.block); return; }
  const multi = q.block === 2, saved = state.saved[state.i];
  const sel = state.sel[state.i];
  card.className = "card " + (multi ? "check" : "radio");
  card.innerHTML = `
    <h2>№ ${q.n}</h2>
    <div class="q">${q.text}</div>
    ${q.img ? `<img class="img" src="${q.img}" alt="">` : ""}
    ${q.text2 ? `<div class="q">${q.text2}</div>` : ""}
    <div id="opts"></div>
    <div class="hint">Ответ можно сохранять несколько раз</div>
    <button class="btn" id="save" ${sel.length ? "" : "disabled"}>Сохранить ответ</button>
    <div class="nav">
      <button class="arrow" id="prev" ${state.i === 0 ? "disabled" : ""}>‹</button>
      <button class="arrow" id="next">›</button>
    </div>`;
  const box = document.getElementById("opts");
  q.opts.forEach((t, k) => {
    const el = document.createElement("div");
    let cls = "opt" + (sel.includes(k) ? " sel" : "");
    el.className = cls;
    el.innerHTML = `<span class="mark"></span><span>${t}</span>`;
    el.onclick = () => {
      if (multi) {
        const p = sel.indexOf(k);
        p >= 0 ? sel.splice(p, 1) : sel.push(k);
      } else { sel.length = 0; sel.push(k); }
      state.saved[state.i] = null;
      render();
    };
    box.appendChild(el);
  });
  document.getElementById("save").onclick = () => { state.saved[state.i] = true; render(); };
  document.getElementById("prev").onclick = () => { state.i--; render(); };
  document.getElementById("next").onclick = () => { state.i++; render(); };
  dots();
}
render();
</script>
